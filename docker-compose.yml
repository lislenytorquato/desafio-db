services:
  postgres:
    image: postgres
    container_name: postgres
    restart: unless-stopped
    environment:
       POSTGRES_USER: pessoas
       POSTGRES_PASSWORD: pessoas
       POSTGRES_DB: pessoas_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-pessoas-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    restart: unless-stopped
    environment:
       PGADMIN_DEFAULT_EMAIL: admin@admin.com.br
       PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - postgres

volumes:
    postgres-pessoas-data: